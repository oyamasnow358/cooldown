<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="クールダウン">
<meta name="theme-color" content="#EAF4FB">
<title>こころの火山 クールダウン｜MieeL</title>
<style>
  /* ============================================================
     こころの火山 クールダウン  見た目（CSS）
     ============================================================ */
  :root {
    --mieel: radial-gradient(circle at 50% 0%,#1B8FE8 0%,#2BB8D6 28%,#3FCB9E 45%,#8FD24A 58%,#F4D027 72%,#F7941E 100%);
    --bg: #EAF4FB;
    --ink: #1F2937;
    --sub: #6B7280;
    --line: #CFE0EC;
    --go: #2F9E44; --go-d: #237A34;
    --blue: #1C7ED6; --blue-d: #1864AB;
    --teal: #0CA678; --teal-d: #087F5B;
    --orange: #F76707;
    --pink: #F06595;
    --gold: #FAB005;
    --emo: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-weight: 700;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    touch-action: manipulation; overscroll-behavior: none;
    display: flex; flex-direction: column; height: 100vh; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden; transition: background-color .8s;
  }
  body.warm { background: #FFF1E6; }
  body.cool { background: #E3F2FD; }
  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  .emo { font-family: var(--emo); font-weight: 400; line-height: 1; }

  /* ---------- 上のバー ---------- */
  .topbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; min-height: 68px; }
  .chip {
    display: flex; align-items: center; gap: 8px; padding: 4px 16px 4px 8px; border-radius: 999px;
    background: #fff; border: 3px solid var(--line); font-size: 20px; white-space: nowrap;
  }
  .chip .emo { font-size: 30px; }
  .chip[hidden] { display: none; }
  .brand { flex: 1; display: flex; justify-content: center; align-items: center; gap: 14px; color: #7FA3BD; font-size: 16px; letter-spacing: .1em; min-width: 0; }
  .mieel-brand { display: flex; align-items: center; gap: 7px; white-space: nowrap; flex: none; }
  .orb-mini { width: 22px; height: 22px; border-radius: 50%; background: var(--mieel); flex: none; }
  .mieel-brand strong { font-size: 16px; color: var(--ink); letter-spacing: .02em; }
  .mieel-brand .url { font-size: 12px; color: var(--sub); font-weight: 600; }
  .mieel-foot { margin-top: 28px; padding-top: 16px; border-top: 1px solid #E9ECEF; text-align: center; color: var(--sub); font-size: 13px; line-height: 1.8; }
  .mieel-foot .mieel-brand { justify-content: center; }
  .mieel-foot a { color: #1C7ED6; font-weight: 700; text-decoration: none; font-size: 14px; }
  @media (max-width: 699px) { .topbar .mieel-brand .url, .topbar .appname { display: none; } }
  .gear { position: relative; width: 52px; height: 52px; border-radius: 50%; border: none; background: transparent; opacity: .35; font-size: 26px; display: grid; place-items: center; }
  .gear::after { content: ""; position: absolute; inset: 2px; border-radius: 50%; border: 4px solid transparent; }
  .gear.pressing { opacity: 1; }
  .gear.pressing::after { border-color: var(--blue); animation: ring 1.5s linear forwards; }
  @keyframes ring { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }

  main { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0 20px 18px; }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; animation: fadein .3s ease-out; gap: clamp(8px, 1.6vh, 16px); }
  @keyframes fadein { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes pop { from { transform: scale(.7); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes wiggle { 20%, 60% { transform: translate(-50%, -50%) rotate(-8deg); } 40%, 80% { transform: translate(-50%, -50%) rotate(8deg); } }
  @keyframes pulse { to { transform: scale(1.06); } }
  .title, .hello, .tmsg, .tsub, .nextcard { word-break: keep-all; overflow-wrap: anywhere; }
  .title { font-size: clamp(28px, 4.4vw, 52px); text-align: center; margin: 0; line-height: 1.35; }
  .title small { display: block; font-size: .5em; color: var(--sub); }
  .split { flex: 1; display: flex; gap: clamp(14px, 3vw, 44px); align-items: center; justify-content: center; min-height: 0; }

  /* 大きいボタン */
  .actions { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .big-btn {
    min-width: min(360px, 78vw); min-height: 92px; padding: 0 36px; border: none; border-radius: 999px;
    color: #fff; font-size: clamp(26px, 3.6vw, 42px); display: inline-flex; align-items: center; justify-content: center; gap: 12px;
  }
  .big-btn.go { background: var(--go); box-shadow: 0 8px 0 var(--go-d); }
  .big-btn.blue { background: var(--blue); box-shadow: 0 8px 0 var(--blue-d); }
  .big-btn.teal { background: var(--teal); box-shadow: 0 8px 0 var(--teal-d); }
  .big-btn.white { background: #fff; color: var(--ink); box-shadow: 0 8px 0 var(--line); border: 4px solid var(--line); }
  .big-btn:active { transform: translateY(6px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .big-btn[disabled] { opacity: .35; pointer-events: none; }
  .mid-btn { min-height: 66px; padding: 0 26px; border-radius: 999px; border: 4px solid var(--line); background: #fff; font-size: clamp(20px, 2.4vw, 26px); box-shadow: 0 5px 0 var(--line); display: inline-flex; align-items: center; gap: 8px; }
  .mid-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .mid-btn.sos { border-color: #FFA8A8; color: #C92A2A; box-shadow: 0 5px 0 #FFC9C9; }

  /* ---------- 火山 ---------- */
  .volc { position: relative; width: min(42vw, 56vh, 520px); flex: none; }
  .volc .vsvg { width: 100%; display: block; overflow: visible; }
  .volc .vname { text-align: center; font-size: clamp(22px, 3vw, 36px); margin-top: -4px; }
  .vsvg .smoke { transform-box: fill-box; transform-origin: center; animation: puff 2.6s ease-out infinite; opacity: 0; }
  .vsvg .s1 { animation-delay: .65s; } .vsvg .s2 { animation-delay: 1.3s; } .vsvg .s3 { animation-delay: 1.95s; }
  @keyframes puff { 0% { transform: translateY(0) scale(.5); opacity: .95; } 100% { transform: translateY(-70px) scale(1.5); opacity: 0; } }
  .vsvg .spark { transform-box: fill-box; transform-origin: center; animation: spk 1.1s ease-out infinite; }
  .vsvg .k1 { animation-name: spk1; animation-delay: .2s; } .vsvg .k2 { animation-name: spk2; animation-delay: .45s; }
  .vsvg .k3 { animation-name: spk3; animation-delay: .7s; } .vsvg .k4 { animation-name: spk1; animation-delay: .9s; } .vsvg .k5 { animation-name: spk2; animation-delay: .1s; }
  @keyframes spk { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(-60px, -40px); opacity: 0; } }
  @keyframes spk1 { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(60px, -50px); opacity: 0; } }
  @keyframes spk2 { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(-20px, -80px); opacity: 0; } }
  @keyframes spk3 { 0% { transform: translate(0, 0); opacity: 1; } 100% { transform: translate(30px, -90px); opacity: 0; } }
  .volc.lv4 .vsvg .mtn { animation: rumble .18s linear infinite; }
  .volc.lv3 .vsvg .mtn { animation: rumble .5s linear infinite; }
  @keyframes rumble { 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
  .vsvg .flower { transform-box: fill-box; transform-origin: bottom center; animation: bloom .9s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes bloom { from { transform: scale(0); } to { transform: none; } }
  .vsvg .mtn path, .vsvg .mtn ellipse { transition: fill .8s; }
  .drop { position: absolute; top: 0; font-size: clamp(26px, 4vw, 44px); pointer-events: none; animation: dropfall 1.3s ease-in forwards; font-family: var(--emo); }
  @keyframes dropfall { from { transform: translateY(-30px); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(200px); opacity: 0; } }

  /* ---------- きもちの おんどけい ---------- */
  .thermo { display: flex; flex-direction: column; gap: clamp(6px, 1.2vh, 12px); width: min(46vw, 540px); }
  .lvbtn {
    display: flex; align-items: center; gap: 14px; padding: 0 22px; min-height: clamp(58px, 11.5vh, 104px);
    border-radius: 26px; border: 5px solid var(--c); background: var(--b); font-size: clamp(22px, 3vw, 38px);
    box-shadow: 0 5px 0 var(--c); text-align: left; position: relative;
  }
  .lvbtn .emo { font-size: 1.55em; }
  .lvbtn .num { margin-left: auto; width: 1.6em; height: 1.6em; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; font-size: .7em; }
  .lvbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--c); }
  .lvbtn.cur { outline: 5px solid var(--ink); outline-offset: 3px; }

  /* ---------- どうぐ ---------- */
  .tgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(250px, 42vw), 1fr)); gap: 14px; overflow-y: auto; flex: 1; align-content: start; padding: 6px; }
  .tcard {
    position: relative; background: #fff; border: 5px solid var(--line); border-radius: 28px; padding: 14px 12px;
    display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; box-shadow: 0 6px 0 rgba(0,0,0,.06);
  }
  .tcard .emo { font-size: clamp(54px, 7vw, 80px); }
  .tcard b { font-size: clamp(22px, 2.6vw, 30px); }
  .tcard small { font-size: 16px; color: var(--sub); }
  .tcard.rec { border-color: var(--teal); background: #F0FFF8; }
  .tcard .tag { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--teal); color: #fff; font-size: 15px; padding: 2px 14px; border-radius: 999px; white-space: nowrap; }
  .tcard .cnt { position: absolute; right: 10px; top: 8px; font-size: 14px; color: var(--gold); }
  .tcard:active { transform: translateY(4px); }

  .thead { display: flex; align-items: center; justify-content: center; gap: 12px; font-size: clamp(24px, 3.4vw, 40px); }
  .thead .emo { font-size: 1.3em; }
  .tbody { flex: 1; display: flex; flex-direction: column; min-height: 0; align-items: center; justify-content: center; gap: clamp(8px, 1.6vh, 16px); }
  .tfoot { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .skip { border: 2px solid #DEE2E6; background: #fff; color: #868E96; font-size: 16px; padding: 10px 16px; border-radius: 999px; }
  .quit { position: relative; overflow: hidden; border: 2px solid #DEE2E6; background: #fff; color: #868E96; font-size: 16px; font-weight: 700; padding: 10px 14px; border-radius: 999px; touch-action: none; }
  .quit i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #FFE3E3; z-index: 0; }
  .quit span { position: relative; z-index: 1; }
  .quit.pressing { color: #E03131; border-color: #FFA8A8; }
  .quit.pressing i { width: 100%; transition: width 1.5s linear; }
  .tmain { flex: 1; display: flex; align-items: center; justify-content: center; gap: clamp(16px, 4vw, 56px); min-height: 0; width: 100%; }
  .tside { display: flex; flex-direction: column; align-items: center; gap: clamp(10px, 2vh, 20px); max-width: min(44vw, 560px); }
  .tmsg { font-size: clamp(30px, 4.6vw, 60px); text-align: center; line-height: 1.35; min-height: 1.35em; }
  .tsub { font-size: clamp(18px, 2.2vw, 26px); color: var(--sub); text-align: center; line-height: 1.5; }
  .safe { font-size: 17px; color: var(--sub); background: #fff; border-radius: 14px; padding: 8px 14px; text-align: center; }
  .rdots { display: flex; gap: 10px; justify-content: center; }
  .rdots i { width: 26px; height: 26px; border-radius: 50%; border: 4px solid var(--line); background: #fff; }
  .rdots i.on { background: var(--teal); border-color: var(--teal); }

  /* かがみ（カメラ）と いきの わ */
  .stage { position: relative; width: min(44vw, 58vh, 520px); aspect-ratio: 1; flex: none; }
  .stage-ring { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, #D0EBFF 55%, #A5D8FF 75%, #74C0FC); transform: scale(.82); box-shadow: 0 0 40px rgba(116, 192, 252, .55); }
  .stage.hold .stage-ring { background: radial-gradient(circle, #FFF3BF 55%, #FFE066 75%, #FCC419); box-shadow: 0 0 40px rgba(252, 196, 25, .5); }
  .stage.out .stage-ring { background: radial-gradient(circle, #C3FAE8 55%, #96F2D7 75%, #63E6BE); }
  .stage-in { position: absolute; inset: 15%; border-radius: 50%; overflow: hidden; background: #fff; display: grid; place-items: center; box-shadow: inset 0 0 0 6px rgba(255,255,255,.9); }
  .stage-in video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); display: none; }
  .stage.cam-on .stage-in video { display: block; }
  .stage.cam-on .stage-emo { display: none; }
  .stage-emo { font-size: clamp(90px, 17vmin, 210px); font-family: var(--emo); line-height: 1; transform: scale(.8); }
  .stage .arc { position: absolute; inset: 1%; width: 98%; height: 98%; transform: rotate(-90deg); pointer-events: none; }
  .stage .arc circle { fill: none; stroke-width: 4; stroke-linecap: round; }
  .bigcount { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(90px, 18vmin, 200px); color: #fff; -webkit-text-stroke: 6px var(--ink); paint-order: stroke fill; pointer-events: none; }
  .badge { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); background: #fff; border-radius: 999px; padding: 4px 16px; font-size: clamp(16px, 2vw, 22px); white-space: nowrap; box-shadow: 0 3px 10px rgba(0,0,0,.12); }
  .camnote { font-size: 14px; color: var(--sub); }

  /* ろうそく */
  .cake { display: flex; gap: clamp(14px, 3vw, 40px); align-items: flex-end; justify-content: center; padding: 20px 26px 0; border-bottom: 18px solid #F8C8D8; border-radius: 0 0 20px 20px; }
  .candle { position: relative; width: clamp(40px, 6vw, 72px); height: clamp(110px, 22vh, 210px); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .wax { width: 100%; height: 72%; border-radius: 12px 12px 4px 4px; background: repeating-linear-gradient(135deg, var(--wc) 0 14px, #fff 14px 22px); box-shadow: inset -6px 0 0 rgba(0,0,0,.08); }
  .wick { width: 4px; height: 12px; background: #495057; border-radius: 2px; }
  .flame { position: absolute; bottom: calc(72% + 10px); left: 50%; width: 56%; height: 30%; margin-left: -28%; border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; background: radial-gradient(ellipse at 50% 72%, #fff 0 18%, #FFE066 35%, #FF922B 70%, rgba(255,107,0,0) 72%); transform-origin: 50% 100%; transform: scaleY(var(--f, 1)) skewX(var(--sk, 0deg)); filter: drop-shadow(0 0 10px rgba(255, 170, 0, .8)); animation: flick .18s ease-in-out infinite alternate; }
  @keyframes flick { to { filter: drop-shadow(0 0 16px rgba(255, 170, 0, .9)); } }
  .candle.now .wax { outline: 4px dashed var(--blue); outline-offset: 6px; }
  .candle.off .flame { display: none; }
  .candle .puff { position: absolute; bottom: calc(72% + 8px); left: 50%; font-size: 40px; font-family: var(--emo); animation: smk 1.4s ease-out forwards; }
  @keyframes smk { from { transform: translate(-50%, 0) scale(.5); opacity: .9; } to { transform: translate(-50%, -90px) scale(1.4); opacity: 0; } }
  .meter { width: min(520px, 80vw); height: 26px; border-radius: 999px; background: #fff; border: 3px solid var(--line); position: relative; overflow: hidden; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #74C0FC, #3BC9DB); transition: width .08s; }
  .meter b { position: absolute; top: -3px; bottom: -3px; width: 4px; background: var(--ink); }
  .blowbtn { width: min(300px, 70vw); min-height: 84px; border-radius: 999px; border: none; background: #74C0FC; color: #fff; font-size: 24px; box-shadow: 0 7px 0 #339AF0; touch-action: none; }
  .blowbtn.on { background: #339AF0; transform: translateY(5px); box-shadow: 0 2px 0 #1C7ED6; }

  /* かぞえる */
  .board { position: relative; flex: 1; width: 100%; min-height: 0; }
  .bub {
    position: absolute; transform: translate(-50%, -50%); width: var(--s); height: var(--s); border-radius: 50%; border: none;
    background: radial-gradient(circle at 35% 30%, #fff 0 12%, #A5D8FF 40%, #4DABF7); color: #0B4F8A;
    font-size: calc(var(--s) * .44); box-shadow: 0 6px 0 rgba(28, 126, 214, .35);
  }
  .bub.pop { animation: bubpop .45s ease-out forwards; pointer-events: none; }
  @keyframes bubpop { to { transform: translate(-50%, -50%) scale(1.6); opacity: 0; } }
  .bub.bad { animation: wiggle .4s; }
  .bub.hint { box-shadow: 0 0 0 8px #FFE066, 0 6px 0 rgba(28, 126, 214, .35); }

  /* さがす */
  .swatch { width: clamp(110px, 18vh, 170px); height: clamp(110px, 18vh, 170px); border-radius: 30px; border: 6px solid rgba(0,0,0,.08); display: grid; place-items: center; font-size: clamp(70px, 12vh, 110px); font-family: var(--emo); }
  .fdots { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  .fdot { width: clamp(84px, 12vw, 120px); aspect-ratio: 1; border-radius: 50%; border: 6px dashed #ADB5BD; background: #fff; font-size: clamp(40px, 6vw, 60px); font-family: var(--emo); }
  .fdot.on { border-style: solid; border-color: var(--teal); background: #E6FCF5; animation: pop .4s cubic-bezier(.2, 1.6, .4, 1); }

  /* よむ */
  .rline {
    background: #fff; border-radius: 32px; border: 5px solid var(--line); padding: clamp(18px, 3vh, 36px) clamp(18px, 3vw, 40px);
    font-size: clamp(34px, 6vw, 84px); line-height: 1.5; text-align: center; max-width: 94vw; letter-spacing: .04em;
  }
  .rline span { color: #C5CED6; transition: color .15s; }
  .rline span.on { color: var(--ink); }
  .rline span.now { color: var(--blue); text-decoration: underline; text-decoration-thickness: 5px; text-underline-offset: 10px; }
  .rprog { display: flex; gap: 8px; }
  .rprog i { width: 18px; height: 18px; border-radius: 50%; background: var(--line); }
  .rprog i.on { background: var(--blue); }

  /* えらぶ カード */
  .cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(190px, 40vw), 1fr)); gap: 12px; overflow-y: auto; width: 100%; flex: 1; align-content: start; padding: 6px; }
  .ccard { background: #fff; border: 5px solid var(--line); border-radius: 24px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: clamp(18px, 2.2vw, 24px); text-align: center; line-height: 1.3; }
  .ccard .emo { font-size: clamp(44px, 6vw, 64px); }
  .ccard.on { border-color: var(--ink); background: #FFF9DB; transform: scale(1.03); }
  .ccard:active { transform: translateY(3px); }

  /* ぎゅっと ふわっ */
  .mus { font-size: clamp(120px, 26vmin, 260px); font-family: var(--emo); line-height: 1; transition: transform .6s; }
  .mus.tight { animation: tight .12s linear infinite; }
  @keyframes tight { 50% { transform: scale(.94) translateX(3px); } }
  .mus.soft { animation: soft 3s ease-in-out infinite alternate; }
  @keyframes soft { from { transform: translateY(0); } to { transform: translateY(14px) scale(1.04); } }
  .bar { width: min(560px, 80vw); height: 22px; border-radius: 999px; background: #fff; border: 3px solid var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--c, var(--teal)); }

  /* やすむ */
  .aqua { position: relative; width: min(92vw, 900px); flex: 1; min-height: 240px; border-radius: 36px; overflow: hidden; background: linear-gradient(#B3E5FC, #4FC3F7 60%, #0288D1); }
  .aqua canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .aqua .clock { position: absolute; right: 16px; top: 14px; background: rgba(255,255,255,.85); border-radius: 999px; padding: 6px 18px; font-size: 24px; }
  .mins { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

  /* ほめる・カード */
  .praise { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); font-size: clamp(54px, 9vw, 120px); font-weight: 900; color: var(--teal); white-space: nowrap; -webkit-text-stroke: 5px #fff; paint-order: stroke fill; pointer-events: none; z-index: 40; animation: praise 1.4s ease-out forwards; }

  function planFor(p, lv) {
    const en = enabled();
    if (p.plan.mode === 'mine') { const l = p.plan.mine.filter(id => en.indexOf(id) >= 0); if (l.length) return l; }
    let base = (BASE[lv] || BASE[2]).filter(id => en.indexOf(id) >= 0);
    // これまでの きろくで よく きいた どうぐを まえに（データが 2かい いじょう ある どうぐだけ）
    const sc = toolScores(p), val = id => sc[id] && sc[id].n >= 2 ? sc[id].sum / sc[id].n : null;
    const sortKnown = arr => {
      const known = arr.filter(id => val(id) !== null).sort((a, b) => val(b) - val(a));
      let k = 0; return arr.map(id => val(id) !== null ? known[k++] : id);
    };
    if (lv >= 3) base = sortKnown(base.filter(id => TOOLS[id].kind === 'body')).concat(sortKnown(base.filter(id => TOOLS[id].kind !== 'body')));
    else base = sortKnown(base);
    return base;
  }

  const camNote = () => h('div', { class: 'camnote', hidden: true }, '📷 かがみ（カメラ）の えいぞうは ほぞん しません');
  const paceOf = () => S().breathPace === '3-5' ? [3, 5] : S().breathPace === '5-7' ? [5, 7] : [4, 6];

  /* 1) いきを とめて かぞえよう（インカメラ） */
  RUN.hold = (body, done) => {
    const rounds = Number(S().holdRounds) || 2, secs = Number(S().holdSec) || 10;
    const note = camNote(), st = stage('🐡', note);
    const msg = h('div', { class: 'tmsg' }, 'すって、とめて、ふーっ'), sub = h('div', { class: 'tsub' }, secs + ' かぞえる あいだ いきを とめるよ'), dots = dotsRow(rounds);
    let skip = false;
    const outBtn = h('button', { type: 'button', class: 'mid-btn', hidden: true, onclick: () => { skip = true; } }, '😮‍💨 はいちゃった');
    const safe = h('div', { class: 'safe' }, 'くるしく なったら、すぐに はいて いいよ');
    body.append(h('div', { class: 'tmain' }, st.el, h('div', { class: 'tside' }, msg, sub, dots, startBtn('▶ はじめる', go), outBtn, safe, note)));
    speak('いきを すって、とめて、ふーっと はくよ。じゅんびが できたら はじめる を おしてね');
    async function go() {
      for (let r = 0; r < rounds; r++) {
        skip = false;
        st.mode(null); st.arc(0); msg.textContent = 'はなから すって…'; sub.textContent = '🌬️ すー'; speak('はなから すって'); sfx.inhale();
        st.size(1.12, 3500); await wait(3800);
        st.mode('hold'); msg.textContent = 'とめて！'; sub.textContent = 'いきを とめて、かずを みてね'; st.badge.hidden = false; st.badge.textContent = '🐡 ほっぺ ぷくー'; outBtn.hidden = false;
        speak('とめて');

        onStop(() => { try { s.stop(); lfo.stop(); g.disconnect(); } catch (e) { /* 無視 */ } });
      } catch (e) { /* 音が なくても 動く */ }

  function toolScores(p) {
    const m = {};
    p.records.forEach(r => (r.checks || []).forEach(c => { if (c.before == null || c.after == null) return; const o = m[c.tool] || (m[c.tool] = { n: 0, sum: 0 }); o.n++; o.sum += c.before - c.after; }));
    return m;
  }
  function topCounts(arr) { const m = {}; arr.forEach(x => { if (x) m[x] = (m[x] || 0) + 1; }); return Object.keys(m).map(k => [k, m[k]]).sort((a, b) => b[1] - a[1]); }

  const ymd = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

  function buildPages(type, opt) {
    opt = opt || {};
    const p = opt.profileId ? (store.profiles.find(x => x.id === opt.profileId) || cur()) : cur();
    const pages = [];
    if (type === 'meter') {
      const rows = [4, 3, 2, 1, 0].map(i => {
        const L = LV[i];
        let d;
        if (i === 0) d = 'このまま すごそう。れんしゅうも できるよ';
        else if (opt.blank) d = '<div class="ln"></div><div class="ln"></div>';
        else d = planFor(p, i).slice(0, 3).map(id => '<span class="pe">' + TOOLS[id].e + '</span> ' + TOOLS[id].n).join('<br>');
        return '<div class="r" style="--c:' + L.c + ';--b:' + L.b + '"><span class="pe">' + L.e + '</span><div class="n">' + i + '　' + L.n + '<small>' + L.d + '</small></div><div class="d">' + (i ? '<small>こうなったら：</small><br>' : '') + d + '</div></div>';
      }).join('');
      pages.push('<div class="ppage">' + pageHead('きもちの おんどけい', p) + '<div class="pmeter">' + rows + '</div>' + PF + '</div>');
    } else if (type === 'plan') {
      const lv = Number(opt.level) || 3;
      const ids = planFor(p, lv).slice(0, 4);
      const steps = ids.map((id, i) => '<div class="s"><span class="k">' + (i + 1) + '</span><span class="pe">' + TOOLS[id].e + '</span><div><b>' + TOOLS[id].n + '</b><small>' + TOOLS[id].d + '</small></div><span class="ck"></span></div>').join('');
      pages.push('<div class="ppage">' + pageHead((p.name && p.name !== 'みんな' ? esc(p.name) + 'の ' : 'わたしの ') + 'クールダウン プラン', p, false) +
        '<div style="font-size:5.5mm">おこったら、この じゅんばんで やってみよう。できたら □ に ○</div>' +
        '<div class="pplan">' + steps + '<div class="s" style="border-style:dashed"><span class="k">★</span><span class="pe">🙋</span><div><b>こまったら せんせいに いう</b><small>「たすけて」と いっても いいよ</small></div></div></div>' + PF + '</div>');
    } else if (type === 'talk') {
      const lines = String(S().talk || DEFAULT_TALK).split(/\n/).map(s => s.trim()).filter(Boolean);
      for (let i = 0; i < lines.length; i += 7) {
        pages.push('<div class="ppage">' + pageHead('よんで おちつく ことば', p) + '<div style="font-size:5mm">こえに だして よもう。よめたら ○ を ぬろう</div><div class="ptalk">' +
          lines.slice(i, i + 7).map(l => '<div class="t"><i></i><span>' + esc(l) + '</span></div>').join('') + '</div>' + PF + '</div>');
      }
    } else if (type === 'sheet') {
      const faces = LV.map(l => l.e).join('');
      const n = Number(opt.rows) || 6;
      let rows = '';
      for (let i = 0; i < n; i++) rows += '<tr class="e"><td style="width:22mm">　/　</td><td class="f">' + faces + '</td><td></td><td></td><td class="f">' + faces + '</td></tr>';
      pages.push('<div class="ppage">' + pageHead('ふりかえり シート', p) + '<div style="font-size:4.5mm">まえ と あと の かおに ○を つけよう</div><table class="psheet"><tr><th>ひづけ</th><th>まえ</th><th>なにが あった？</th><th>やった こと</th><th>あと</th></tr>' + rows + '</table>' + PF + '</div>');
    } else if (type === 'record') {
      const recs = p.records.filter(r => r.mode === 'help').slice().reverse();
      const per = 18;
      for (let i = 0; i < Math.max(1, recs.length); i += per) {
        const rows = recs.slice(i, i + per).map(r => '<tr><td>' + ymd(r.t) + ' ' + fmtDate(r.t).split(' ')[1] + '</td><td class="f">' + LV[r.from].e + '→' + LV[r.to].e + '</td><td>' + esc(r.reason || '') + '</td><td>' + esc(r.feeling || '') + '</td><td class="f" style="letter-spacing:0">' + (r.tools || []).map(id => TOOLS[id] ? TOOLS[id].e : '').join('') + '</td><td>' + esc(r.next || (r.stopped ? '（とちゅう）' : '')) + '</td></tr>').join('');
        pages.push('<div class="ppage">' + pageHead('クールダウンの きろく', p) + '<table class="psheet" style="font-size:3.6mm"><tr><th>日時</th><th>まえ→あと</th><th>なにが あった</th><th>きもち</th><th>どうぐ</th><th>このあと</th></tr>' + (rows || '<tr><td colspan="6">まだ きろくが ありません</td></tr>') + '</table>' + PF + '</div>');
      }
    }
    return pages;
  }

      h('div', null, '© こころの火山 クールダウン（特別支援教育向け）・学校や家庭での利用は自由です（無断転載・再配布・販売はお断り）')));
  }

  function recordView(p) {
    const box = h('div');
    const helps = p.records.filter(r => r.mode === 'help');
    const pr = p.records.filter(r => r.mode === 'practice');
    const ck = p.records.filter(r => r.mode === 'checkin');
    if (!helps.length && !pr.length && !ck.length) { box.append(h('p', { class: 'note' }, 'まだ きろくが ありません。')); return box; }
    const done = helps.filter(r => !r.stopped);
    const avg = a => a.length ? (a.reduce((s, x) => s + x, 0) / a.length) : 0;
    const mins = avg(done.map(r => (r.sec || 0) / 60));
    box.append(h('div', { class: 'stat' },
      h('div', null, h('b', null, helps.length + 'かい'), 'クールダウン（おちついた ' + done.length + '）'),
      h('div', null, h('b', null, done.length ? avg(done.map(r => r.from)).toFixed(1) + ' → ' + avg(done.map(r => r.to)).toFixed(1) : '―'), 'きもちの つよさ（まえ → あと）'),
      h('div', null, h('b', null, done.length ? mins.toFixed(1) + 'ふん' : '―'), 'おちつくまでの じかん（へいきん）'),
      h('div', null, h('b', null, pr.length + 'かい'), 'れんしゅう'),
      h('div', null, h('b', null, ck.length ? ck.length + 'かい（' + avg(ck.map(r => r.from)).toFixed(1) + '）' : '―'), 'きもち チェック（へいきん）')));
    if (ck.length) box.append(h('p', { class: 'note', style: 'color:var(--ink)' }, h('b', null, 'さいきんの きもち チェック：'), ck.slice(-14).map(r => fmtDate(r.t).split(' ')[0] + ' ' + LV[r.from].e).join('　')));
    const sc = toolScores(p);
    const rows = Object.keys(sc).filter(id => TOOLS[id]).map(id => [id, sc[id].sum / sc[id].n, sc[id].n]).sort((a, b) => b[1] - a[1]);
    if (rows.length) {
      box.append(h('h4', null, '✨ この子に よく きいた どうぐ（1かいで さがった きもちの つよさ）'));
      rows.forEach(r => box.append(h('div', { class: 'hbar' }, h('span', null, TOOLS[r[0]].e + ' ' + TOOLS[r[0]].n), h('i', { style: 'width:' + Math.max(2, r[1] * 90) + 'px;background:' + (r[1] > 0 ? 'var(--teal)' : '#ADB5BD') }), h('span', null, (r[1] >= 0 ? '−' : '+') + Math.abs(r[1]).toFixed(1) + '（' + r[2] + 'かい）'))));
    }
    const rs = topCounts(helps.map(r => r.reason)), fs = topCounts(helps.map(r => r.feeling));
    const hours = topCounts(helps.map(r => { const hh = new Date(r.t).getHours(); return hh < 10 ? 'あさ（〜10じ）' : hh < 12 ? 'ごぜん（10〜12じ）' : hh < 14 ? 'ひる（12〜14じ）' : 'ごご（14じ〜）'; }));
    const line = (t, arr) => arr.length ? h('p', { class: 'note', style: 'color:var(--ink)' }, h('b', null, t + '：'), arr.slice(0, 5).map(a => a[0] + '（' + a[1] + '）').join('、')) : null;
    box.append(...[line('よく あった こと', rs), line('きもち', fs), line('じかんたい', hours)].filter(Boolean));
    const tb = h('table', { class: 'rec-table' }, h('tr', null, ['日時', 'まえ→あと', 'なにが あった・きもち', 'どうぐ', 'このあと'].map(t => h('th', null, t))));
    helps.slice().reverse().slice(0, 40).forEach(r => tb.append(h('tr', null,
      h('td', null, fmtDate(r.t)), h('td', null, E(LV[r.from].e), '→', E(LV[r.to].e)),
      h('td', null, [r.reason, r.feeling].filter(Boolean).join('／') || '―'),
      h('td', null, E((r.tools || []).map(id => TOOLS[id] ? TOOLS[id].e : '').join(''))),
      h('td', null, r.stopped ? '（とちゅうで おわり）' : (r.next || '')))));
    box.append(h('h4', null, 'さいきんの クールダウン'), tb,
      h('div', { class: 'btns' }, h('button', { type: 'button', class: 'btn', onclick: () => csv(p) }, '⬇ CSV で ほぞん（Excel）')));
    return box;
  }
  function csv(p) {
    const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
    const lines = [['日付', '時刻', '種類', 'まえ', 'あと', 'どうぐ', 'なにがあった', 'きもち', 'からだ', 'このあと', '分', 'とちゅう終了'].map(q).join(',')];
    p.records.forEach(r => {
      const d = new Date(r.t);
      lines.push([ymd(r.t), d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'), r.mode === 'help' ? 'クールダウン' : r.mode === 'checkin' ? 'きもちチェック' : 'れんしゅう',
        r.from != null ? r.from + ' ' + LV[r.from].n : '', r.to != null ? r.to + ' ' + LV[r.to].n : '',
        (r.tools || []).map(id => TOOLS[id] ? TOOLS[id].n : id).join(' / '), r.reason, r.feeling, (r.body || []).join(' / '), r.next,
        r.sec ? (r.sec / 60).toFixed(1) : '', r.stopped ? 'はい' : ''].map(q).join(','));
    });
    const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv' });
    const a = h('a', { href: URL.createObjectURL(blob), download: 'クールダウン記録_' + p.name + '_' + ymd(Date.now()) + '.csv' });
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  // ⚙️ ながおしで ひらく
  (function () {
    const g = $('#gear'); let t = 0;
    const down = e => { e.preventDefault(); g.classList.add('pressing'); t = setTimeout(() => { g.classList.remove('pressing'); openSettings(); }, 1500); };
    const up = () => { clearTimeout(t); g.classList.remove('pressing'); };
    g.addEventListener('pointerdown', down); ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => g.addEventListener(ev, up));
    g.addEventListener('contextmenu', e => e.preventDefault());
  })();
  $('#settings').addEventListener('click', e => { if (e.target.id === 'settings') closeSettings(); });
  $('#whoChip').addEventListener('click', () => { if (screen === 'tool' || screen === 'check' || ses) return; renderWho(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopSpeak(); });

  /* ============================================================
     はじめる
     ============================================================ */
  document.body.classList.toggle('calm', !!S().calm);
  if (canSpeak) { loadVoice(); if ('onvoiceschanged' in speechSynthesis) speechSynthesis.onvoiceschanged = loadVoice; }
  if (store.profiles.length > 1 && !EMBED) renderWho(); else renderTop();
})();
</script>
</body>
</html>
